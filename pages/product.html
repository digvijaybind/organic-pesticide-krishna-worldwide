    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .page-hero{padding:150px 0 40px;background:linear-gradient(135deg,#0f172a,#1e3a2f);text-align:center}
        .page-hero h1{font-size:clamp(1.8rem,3vw,2.5rem);font-weight:900;color:#fff;margin-bottom:8px}
        .breadcrumb{padding:12px 0;font-size:0.85rem;color:rgba(255,255,255,0.6)}
        .breadcrumb a{color:#22c55e}
        .pd-layout{display:grid;grid-template-columns:1fr 1.3fr;gap:50px;padding:60px 0}
        .pd-img{background:#f1f5f9;border-radius:20px;overflow:hidden;height:400px}
        .pd-img img{width:100%;height:100%;object-fit:cover}
        .pd-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;margin-bottom:14px}
        .pd-badge.fertilizer{background:#fef3c7;color:#d97706}
        .pd-badge.pesticide{background:#dcfce7;color:#16a34a}
        .pd-badge.soil{background:#dbeafe;color:#2563eb}
        .pd-badge.growth{background:#fce7f3;color:#db2777}
        .pd-badge.biogas{background:#fed7aa;color:#ea580c}
        .pd-price{font-size:2rem;font-weight:800;color:#16a34a;margin:16px 0}
        .pd-oldprice{font-size:1.1rem;color:#94a3b8;text-decoration:line-through;margin-left:10px;font-weight:400}
        .pd-unit{font-size:0.9rem;color:#64748b}
        .pd-desc{font-size:1rem;color:#475569;line-height:1.8;margin-bottom:24px}
        .pd-buy{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:24px}
        .qty-selector{display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:30px;padding:6px 10px}
        .qty-sel-btn{width:30px;height:30px;border:none;border-radius:50%;background:#16a34a;color:#fff;font-size:1.1rem;cursor:pointer}
        .qty-sel-btn:hover{background:#15803d}
        .qty-val{font-weight:700;min-width:30px;text-align:center;font-size:1.1rem}
        .pd-extra{margin-top:30px;padding-top:20px;border-top:1px solid #e2e8f0}
        .pd-feature{display:flex;align-items:center;gap:10px;color:#64748b;font-size:0.9rem;margin-bottom:10px}
        .pd-feature i{color:#16a34a}
        .related-title{font-size:1.4rem;font-weight:700;margin-bottom:20px}
        .old-price{font-size:0.8rem;color:#94a3b8;text-decoration:line-through;margin-left:6px;font-weight:400}
        .cart-link{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;border-radius:50%;transition:0.2s}
        .navbar.scrolled .cart-link{color:#0f172a}
        .cart-link:hover{background:rgba(22,163,74,0.15);color:#16a34a}
        .cart-badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:0.7rem;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
        .notification{position:fixed;top:100px;right:20px;padding:16px 24px;color:#fff;border-radius:12px;display:flex;align-items:center;gap:12px;font-weight:500;z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:slideInR .5s ease,slideOutR .5s ease 2s forwards}
        @keyframes slideInR{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes slideOutR{from{transform:translateX(0);opacity:1}to{transform:translateX(100px);opacity:0}}
        @media(max-width:900px){.pd-layout{grid-template-columns:1fr}.pd-img{height:300px}}
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="../index.html" class="logo"><div class="logo-icon"><i class="fas fa-seedling"></i></div><div class="logo-text"><span class="logo-main">Organic Pesticide</span><span class="logo-sub">100% Natural Solutions</span></div></a>
            <div class="nav-links" id="navLinks">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../index.html#products" class="nav-link">Products</a>
                <a href="../cart.html" class="nav-link">Cart</a>
                <a href="../index.html#contact" class="nav-link">Contact</a>
            </div>
            <div class="nav-actions">
                <a href="../cart.html" class="cart-link"><i class="fas fa-shopping-cart"></i><span class="cart-badge" style="display:none;">0</span></a>
                <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <section class="page-hero"><div class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="../index.html#products">Products</a> / <span id="pdBreadcrumb">Product</span></div>
        <h1 id="pdName">Loading...</h1></div></section>

    <section class="section" style="padding-top:0;">
        <div class="container">
            <div class="pd-layout">
                <div class="pd-img" id="pdImage"></div>
                <div>
                    <div id="pdCategory"></div>
                    <div class="pd-price"><span id="pdPrice">₹0</span><span class="pd-old-price" id="pdOldPrice"></span><span class="pd-unit" id="pdUnit"></span></div>
                    <p class="pd-desc" id="pdDesc"></p>
                    <div class="pd-extra" id="pdFeatures"></div>
                    <div class="pd-buy">
                        <div class="qty-selector">
                            <button class="qty-sel-btn" onclick="changeQty(-1)">-</button>
                            <span class="qty-val" id="qtyVal">1</span>
                            <button class="qty-sel-btn" onclick="changeQty(1)">+</button>
                        </div>
                        <button class="btn btn-primary" onclick="addItem()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                        <a href="../checkout.html" class="btn btn-whatsapp">Buy Now</a>
                    </div>
                </div>
            </div>

            <h3 class="related-title">You May Also Like</h3>
            <div class="products-grid" id="relatedGrid"></div>
        </div>
    </section>

    <footer class="footer"><div class="container"><div class="footer-social" style="justify-content:center;margin-bottom:16px;"><a href="https://www.facebook.com/share/1LMYJp3Vue/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a><a href="https://www.instagram.com/krishna.world.wide" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a><a href="https://www.linkedin.com/company/krishna-world-wide-agriculture/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a><a href="https://wa.me/919876543210" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a></div><div class="footer-bottom" style="border:none;"><p>&copy; 2026 Organic Pesticide - Krishna Worldwide. All rights reserved. | <a href="../privacy-policy.html">Privacy Policy</a> | <a href="../refund-policy.html">Refund Policy</a> | <a href="../terms-conditions.html">Terms &amp; Conditions</a></p></div></div></footer>

    <script src="../js/cart.js"></script>
    <script src="../js/catalog.js"></script>
    <script>
        let currentProduct = null;
        let qty = 1;
        let isRendering = false;

        document.addEventListener('DOMContentLoaded', async () => {
            Cart.updateCartUI();
            document.getElementById('hamburger').addEventListener('click', () => {
                document.getElementById('navLinks').classList.toggle('active');
            });
            await loadProduct();
        });

        async function loadProduct() {
            const params = new URLSearchParams(location.search);
            const id = params.get('id');
            let product = CATALOG.find(p => p.id === id);

            // Try API if not in static catalog
            if (!product) {
                try {
                    const res = await fetch('../backend/api/products.php?id=' + id);
                    const data = await res.json();
                    if (data.success) product = data.product;
                } catch (e) { }
            }

            if (!product) {
                document.getElementById('pdName').textContent = 'Product not found';
                return;
            }

            currentProduct = product;
            renderProduct(product);
        }

        function renderProduct(p) {
            document.getElementById('pdName').textContent = p.name;
            document.getElementById('pdBreadcrumb').textContent = p.name;
            document.getElementById('pdImage').innerHTML = '<img src="../' + p.image + '" alt="' + p.name + '" onerror="this.onerror=null;this.src=PLACEHOLDER_IMG;">';
            document.getElementById('pdCategory').innerHTML = '<span class="pd-badge ' + p.category + '">' + p.category.charAt(0).toUpperCase() + p.category.slice(1) + '</span>';
            document.getElementById('pdPrice').textContent = '₹' + p.price;
            document.getElementById('pdOldPrice').textContent = p.old_price > 0 ? '₹' + p.old_price : '';
            document.getElementById('pdUnit').textContent = ' / ' + p.unit;
            document.getElementById('pdDesc').textContent = p.long_desc || p.short_desc;

            document.getElementById('pdFeatures').innerHTML = `
                <div class="pd-feature"><i class="fas fa-leaf"></i> 100% Organic & Natural</div>
                <div class="pd-feature"><i class="fas fa-shield-halved"></i> Safe for crops & soil</div>
                <div class="pd-feature"><i class="fas fa-truck"></i> Free shipping above ₹500</div>
                <div class="pd-feature"><i class="fas fa-headset"></i> Expert farming support</div>
            `;
            renderRelated();
        }

        function changeQty(delta) {
            qty = Math.max(1, qty + delta);
            document.getElementById('qtyVal').textContent = qty;
        }

        function addItem() {
            if (!currentProduct) return;
            Cart.add(currentProduct, qty);
            showNote(currentProduct.name + ' added to cart (×' + qty + ')', 'success');
            qty = 1;
            document.getElementById('qtyVal').textContent = qty;
        }

        async function renderRelated() {
            const grid = document.getElementById('relatedGrid');
            const related = CATALOG.filter(p => p.id !== currentProduct.id).slice(0, 3);
            grid.innerHTML = related.map((p, i) => `
                <div class="product-card scroll-reveal" style="--delay:${0.1 + i * 0.1}s">
                    <div class="product-image" style="height:180px;"><img src="../${p.image}" alt="${p.name}" onerror="this.onerror=null;this.src=PLACEHOLDER_IMG;"></div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.short_desc}</p>
                        <div class="product-meta">
                            <span class="product-price">₹${p.price}</span>
                            <button class="btn btn-sm" onclick="location.href='product.html?id=${p.id}'">View</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showNote(msg, type) {
            const el = document.createElement('div');
            el.className = 'notification';
            el.style.background = type === 'error' ? '#ef4444' : '#22c55e';
            el.innerHTML = '<i class="fas ' + (type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle') + '"></i><span>' + msg + '</span>';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }
    </script>
    <a href="https://wa.me/919876543210?text=Hi%20Organic%20Pesticide!" class="whatsapp-widget" target="_blank"><i class="fab fa-whatsapp"></i></a>
</body>
</html>
